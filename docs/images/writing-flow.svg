<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title description">
  <title id="title">小说写作工坊：作者参与的五步写作路径</title>
  <desc id="description">作者定方向，带上原稿与设定，起草或修订，事实与表达复核，最后由作者决定采纳。按任务取用，先保留原稿，未做的检查如实说明。检查通过与作者采纳分别记录。</desc>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .ink { fill: #1B2B3D; }
      .muted { fill: #657078; }
      .copper { fill: #A46F48; }
      .icon { stroke: #A46F48; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .small { font-size: 13px; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="398" rx="18" fill="#F7F3EA" stroke="#E0D9CA"/>
  <path d="M40 38H70" stroke="#A46F48" stroke-width="3"/>
  <text x="81" y="43" class="copper" font-size="11" letter-spacing="2.5">THE WRITING WORKSHOP</text>
  <text x="40" y="83" class="ink" font-size="26" font-weight="600">一条清楚的写作路径</text>
  <text x="1160" y="80" text-anchor="end" class="muted" font-size="14">从方向到取舍，作者始终在场。</text>

  <!-- A five-step path, read from left to right. -->
  <g>
    <rect x="40" y="116" width="208" height="174" rx="10" fill="#FFFDF8" stroke="#DCD4C4"/>
    <text x="58" y="143" class="copper" font-size="11" font-weight="600" letter-spacing="1.5">01</text>
    <g class="icon" transform="translate(58 159)">
      <path d="M17 1L31 15L17 29L3 15Z"/>
      <path d="M21 10L18 18L10 21L13 13Z"/>
    </g>
    <text x="58" y="224" class="ink" font-size="19" font-weight="600">作者定方向</text>
    <text x="58" y="251" class="muted small">明确这次要写什么</text>
    <text x="58" y="272" class="muted small">也明确哪些暂时不动</text>
  </g>
  <g stroke="#BDA78E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M254 203H262M258 199L262 203L258 207"/>
  </g>

  <g>
    <rect x="268" y="116" width="208" height="174" rx="10" fill="#FFFDF8" stroke="#DCD4C4"/>
    <text x="286" y="143" class="copper" font-size="11" font-weight="600" letter-spacing="1.5">02</text>
    <g class="icon" transform="translate(286 159)">
      <path d="M3 3H13C16 3 17 5 17 7V29C17 26 15 25 12 25H3Z"/>
      <path d="M31 3H21C18 3 17 5 17 7V29C17 26 19 25 22 25H31Z"/>
      <path d="M7 9H12M7 14H12M22 9H27M22 14H27"/>
    </g>
    <text x="286" y="224" class="ink" font-size="19" font-weight="600">带上原稿与设定</text>
    <text x="286" y="251" class="muted small">交代人物、情节与约束</text>
    <text x="286" y="272" class="muted small">以已有资料为依据</text>
  </g>
  <g stroke="#BDA78E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M482 203H490M486 199L490 203L486 207"/>
  </g>

  <g>
    <rect x="496" y="116" width="208" height="174" rx="10" fill="#FFFDF8" stroke="#DCD4C4"/>
    <text x="514" y="143" class="copper" font-size="11" font-weight="600" letter-spacing="1.5">03</text>
    <g class="icon" transform="translate(514 159)">
      <path d="M4 26L6 19L23 2L29 8L12 25Z"/>
      <path d="M20 5L26 11M6 19L12 25M4 31H31"/>
    </g>
    <text x="514" y="224" class="ink" font-size="19" font-weight="600">起草或修订</text>
    <text x="514" y="251" class="muted small">按任务选择所需方法</text>
    <text x="514" y="272" class="muted small">让表达服务于故事</text>
  </g>
  <g stroke="#BDA78E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M710 203H718M714 199L718 203L714 207"/>
  </g>

  <g>
    <rect x="724" y="116" width="208" height="174" rx="10" fill="#FFFDF8" stroke="#DCD4C4"/>
    <text x="742" y="143" class="copper" font-size="11" font-weight="600" letter-spacing="1.5">04</text>
    <g class="icon" transform="translate(742 159)">
      <circle cx="14" cy="13" r="10"/>
      <path d="M21 21L30 30M9 13L12 16L18 10"/>
    </g>
    <text x="742" y="224" class="ink" font-size="19" font-weight="600">事实与表达复核</text>
    <text x="742" y="251" class="muted small">核对连贯性与文字问题</text>
    <text x="742" y="272" class="muted small">记录检查范围与结果</text>
  </g>
  <g stroke="#BDA78E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M938 203H946M942 199L946 203L942 207"/>
  </g>

  <g>
    <rect x="952" y="116" width="208" height="174" rx="10" fill="#1B2B3D"/>
    <text x="970" y="143" fill="#D6AD86" font-size="11" font-weight="600" letter-spacing="1.5">05</text>
    <g transform="translate(970 159)" stroke="#D6AD86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="2" width="25" height="29" rx="2"/>
      <path d="M10 10H23M10 16H23M10 23L14 27L23 19"/>
    </g>
    <text x="970" y="224" fill="#FFFDF8" font-size="19" font-weight="600">作者决定采纳</text>
    <text x="970" y="251" fill="#D6DBDE" class="small">保留、调整，或另写一版</text>
    <text x="970" y="272" fill="#D6DBDE" class="small">最终取舍回到作者手中</text>
  </g>

  <path d="M40 316H1160" stroke="#DCD4C4"/>
  <text x="600" y="346" text-anchor="middle" class="ink" font-size="15">按任务取用 · 先保留原稿 · 未做的检查如实说明</text>
  <text x="600" y="374" text-anchor="middle" class="muted" font-size="12">检查通过与作者采纳分别记录</text>
</svg>
